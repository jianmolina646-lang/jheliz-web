services:
  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jheliz -d jheliz_control"]

  web:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_jheliztv
      FLOW_API_KEY_FILE: /run/secrets/flow_api_key
      FLOW_SECRET_KEY_FILE: /run/secrets/flow_secret_key
    secrets:
      - flow_api_key
      - flow_secret_key

  marketing_web:
    extends:
      file: docker-compose.yml
      service: web
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_marketing
      # Override the database inherited from the main site. Marketing uses its
      # own PostgreSQL instance and persistent volume.
      DATABASE_URL_FILE: /run/secrets/marketing_database_url
    ports: !override
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -H 'Host: marketingjhelizxyz.online' -H 'X-Forwarded-Proto: https' http://localhost:8000/healthz/ || exit 1"]
    secrets:
      - flow_api_key
      - flow_secret_key
      - marketing_database_url
    depends_on:
      marketing_db:
        condition: service_healthy
      redis:
        condition: service_healthy

  marketing_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jheliz_marketing
      POSTGRES_PASSWORD_FILE: /run/secrets/marketing_postgres_password
      POSTGRES_DB: jheliz_marketing
    secrets:
      - marketing_postgres_password
    volumes:
      - marketing_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jheliz_marketing -d jheliz_marketing"]
      interval: 5s
      timeout: 5s
      retries: 10

  control_alerts_bot:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_jheliztv

  whatsapp_scheduler:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_jheliztv

  backup:
    environment:
      POSTGRES_DB: jheliz_control

secrets:
  flow_api_key:
    file: ./secrets/flow_api_key.txt
  flow_secret_key:
    file: ./secrets/flow_secret_key.txt
  marketing_database_url:
    file: ./secrets/marketing_database_url.txt
  marketing_postgres_password:
    file: ./secrets/marketing_postgres_password.txt

volumes:
  marketing_postgres_data:
