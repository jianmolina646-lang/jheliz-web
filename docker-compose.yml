services:
  web:
    build: .
    # Gunicorn:
    # - 3 workers + 4 threads (gthread): 12 reqs concurrentes; con --preload los
    #   workers comparten memoria del master, así que 3 workers caben en 2GB RAM
    #   sin estresar al sistema. Si un worker se cuelga en una query lenta del
    #   admin, los otros 2 siguen sirviendo y nginx no tira 504.
    # - --timeout 30: mata workers atascados a los 30s (default explícito).
    # - --graceful-timeout 10: tras SIGTERM espera solo 10s antes de SIGKILL.
    # - --preload: carga el código una vez en master, fork() en workers (ahorra RAM).
    # - --keep-alive 5: nginx reusa la conexión a gunicorn, evita TCP handshake.
    # - --max-requests + jitter: recicla workers cada ~1k requests (evita memory leaks).
    command: ["bash", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4 --worker-class gthread --preload --timeout 30 --graceful-timeout 10 --keep-alive 5 --max-requests 1000 --max-requests-jitter 100 --access-logfile - --error-logfile -"]
    env_file: .env
    environment:
      JHELIZ_CONTROL_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/jheliz_control_telegram_bot_token
    volumes:
      - ./media:/app/media
      - ./private_media:/app/private_media
      - ./secrets/jheliz_control_telegram_bot_token.txt:/run/secrets/jheliz_control_telegram_bot_token:ro
      # En producción Nginx sirve /srv/jheliz/staticfiles. La variable evita
      # que collectstatic escriba en un directorio distinto al publicado.
      - /srv/jheliz/staticfiles:/app/staticfiles
    ports:
      # Solo Nginx del host debe alcanzar Gunicorn. Publicar en 0.0.0.0
      # expone Django directamente y permite saltarse TLS/UFW.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jheliz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      POSTGRES_DB: jheliz
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jheliz"]
      interval: 5s
      timeout: 5s
      retries: 10

  telegram_bot:
    build: .
    command: python manage.py run_telegram_bot
    env_file: .env
    depends_on:
      - web
    restart: unless-stopped
    profiles:
      - bot  # Inicia solo con: docker compose --profile bot up

  codes_bot:
    build: .
    command: python manage.py run_codes_bot
    env_file: .env
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    volumes:
      - ./secrets/database_url.txt:/run/secrets/database_url:ro
    depends_on:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    profiles:
      - bot  # Inicia junto al resto con: docker compose --profile bot up

  disney_bot:
    build: .
    command: python manage.py run_disney_bot
    env_file: .env
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    extra_hosts:
      - "proton-bridge.internal:host-gateway"
    volumes:
      - ./secrets/database_url.txt:/run/secrets/database_url:ro
    depends_on:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    profiles:
      - bot  # Inicia junto al resto con: docker compose --profile bot up

  control_alerts_bot:
    build: .
    command: python manage.py run_control_telegram_bot
    env_file: .env
    environment:
      JHELIZ_CONTROL_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/jheliz_control_telegram_bot_token
    volumes:
      - ./secrets/jheliz_control_telegram_bot_token.txt:/run/secrets/jheliz_control_telegram_bot_token:ro
    depends_on:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    profiles:
      - control-alerts

  whatsapp_scheduler:
    build: .
    command: python manage.py run_control_whatsapp_scheduler
    env_file: .env
    depends_on:
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    profiles:
      - control-alerts

  backup:
    profiles:
      - backup
    build: ./backup
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h db -U $${POSTGRES_USER} -d $${POSTGRES_DB} && pgrep -x cron >/dev/null && test -w /backups"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file: .env
    environment:
      POSTGRES_USER: jheliz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: jheliz
      MEGA_FOLDER: ${MEGA_FOLDER:-/JhelizControlBackups}
      BACKUP_DAILY_KEEP_DAYS: ${BACKUP_DAILY_KEEP_DAYS:-30}
      BACKUP_MONTHLY_KEEP_MONTHS: ${BACKUP_MONTHLY_KEEP_MONTHS:-12}
      BACKUP_NAME_PREFIX: "${BACKUP_NAME_PREFIX:-jheliz-control}"
      BACKUP_CRON_SCHEDULE: "${BACKUP_CRON_SCHEDULE:-20 3 * * *}"
      BACKUP_NOTIFY_SUCCESS: "${BACKUP_NOTIFY_SUCCESS:-true}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - jheliz_backup_data:/backups
      - jheliz_mega_session:/root/.megaCmd
      - ./media:/source/media:ro
      - ./private_media:/source/private_media:ro
      - ./.env:/source/config/.env:ro
      - ./secrets:/source/config/secrets:ro

volumes:
  postgres_data:
  jheliz_backup_data:
  jheliz_mega_session:
