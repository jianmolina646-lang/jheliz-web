name: Temporary SSH unban

on:
  push:
    paths:
      - .github/workflows/temporary-ssh-unban.yml

jobs:
  unban:
    runs-on: [self-hosted, Linux, X64, jheliz-production]
    timeout-minutes: 3
    steps:
      - name: Remove one IP from Fail2ban SSH jail
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged -v /:/host alpine:3.20 \
            chroot /host fail2ban-client set sshd unbanip 179.6.13.198
