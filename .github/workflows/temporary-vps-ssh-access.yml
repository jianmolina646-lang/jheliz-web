name: Temporary VPS SSH access

on:
  push:
    paths:
      - .github/workflows/temporary-vps-ssh-access.yml

jobs:
  install-key:
    runs-on: [self-hosted, Linux, X64, jheliz-production]
    timeout-minutes: 3
    steps:
      - name: Install dedicated public key for root through Docker
        shell: bash
        run: |
          set -euo pipefail
          key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGnj4yo1WMHcxYAIElCbaqxjUBYypRAU2xP4vHkVsBJw jheliztv-contabo'
          docker run --rm \
            -e ACCESS_KEY="$key" \
            -v /root:/hostroot \
            alpine:3.20 sh -eu -c '
              mkdir -p /hostroot/.ssh
              chmod 700 /hostroot/.ssh
              touch /hostroot/.ssh/authorized_keys
              grep -qxF "$ACCESS_KEY" /hostroot/.ssh/authorized_keys || printf "%s\n" "$ACCESS_KEY" >> /hostroot/.ssh/authorized_keys
              chmod 600 /hostroot/.ssh/authorized_keys
            '
          echo 'Dedicated SSH key installed for root.'
