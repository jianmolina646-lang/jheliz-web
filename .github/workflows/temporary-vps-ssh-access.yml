name: Temporary VPS SSH access

on:
  push:
    paths:
      - .github/workflows/temporary-vps-ssh-access.yml

jobs:
  install-key:
    runs-on: [self-hosted, Linux, X64, jheliz-production]
    timeout-minutes: 3
    steps:
      - name: Install dedicated public key for runner account
        shell: bash
        run: |
          set -euo pipefail
          key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGnj4yo1WMHcxYAIElCbaqxjUBYypRAU2xP4vHkVsBJw jheliztv-contabo'
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          if ! grep -qxF "$key" "$HOME/.ssh/authorized_keys"; then
            printf '%s\n' "$key" >> "$HOME/.ssh/authorized_keys"
          fi
          chmod 600 "$HOME/.ssh/authorized_keys"
          echo "Dedicated SSH key installed for $(id -un)."
