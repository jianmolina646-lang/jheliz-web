{% extends "jheliztv/control/base.html" %}
{% block jc_content %}
<div class="jc-panel" style="max-width:760px;margin:20px auto;">
  <h2 class="jc-section-title"><span class="material-symbols-outlined">verified_user</span> Enlace generado</h2>
  <p style="color:#d1d5db;">Usuario: <strong>{{ tenant.user.username }}</strong></p>
  <p style="color:#9ca3af;">Válido durante 15 minutos y de un solo uso. Envíalo únicamente después de verificar la identidad del titular.</p>
  <label style="display:block;color:#d1d5db;font-size:.84rem;margin-bottom:6px;">Enlace de recuperación</label>
  <textarea id="recoveryLink" readonly rows="4" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;">{{ recovery_url }}</textarea>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;">
    <button type="button" class="jc-btn" onclick="navigator.clipboard.writeText(document.getElementById('recoveryLink').value);this.textContent='Copiado';">
      Copiar enlace
    </button>
    <a class="jc-btn jc-btn--ghost" href="{% url 'jheliztv_control_dashboard' %}">Volver al control</a>
  </div>
</div>
{% endblock %}
