limit_req_zone $binary_remote_addr zone=jheliz_digital_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=jheliz_digital_general:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=jheliz_digital_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name ecormecejhelizstore.com www.ecormecejhelizstore.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name ecormecejhelizstore.com www.ecormecejhelizstore.com;

    ssl_certificate /etc/letsencrypt/live/ecormecejhelizstore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecormecejhelizstore.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn jheliz_digital_connections 30;

    location /static/ {
        alias /opt/jheliz-digital/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location = /health/ {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(ingresar|admin/login)/$ {
        limit_req zone=jheliz_digital_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=jheliz_digital_general burst=30 nodelay;
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
