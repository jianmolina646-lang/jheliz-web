services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:8200:8000"
    volumes:
      - ./staticfiles:/app/staticfiles
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000
        --workers 3 --threads 2 --timeout 60
        --access-logfile - --error-logfile -
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request = urllib.request.Request(
          'http://127.0.0.1:8000/health/',
          headers={'Host': 'ecormecejhelizstore.com', 'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backup:
    profiles:
      - backup
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MEGA_FOLDER: /JhelizDigitalBackups
      BACKUP_NAME_PREFIX: jheliz-digital
      BACKUP_DAILY_KEEP_DAYS: "30"
      BACKUP_MONTHLY_KEEP_MONTHS: "12"
      BACKUP_CRON_SCHEDULE: "20 4 * * *"
    volumes:
      - backup_data:/backups
      - mega_session:/root/.megaCmd
      - ./.env:/source/config/.env:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h db -U $${POSTGRES_USER} -d $${POSTGRES_DB}
          && pgrep -x cron >/dev/null && test -w /backups
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    name: jheliz_digital_postgres_data
  backup_data:
    name: jheliz_digital_backup_data
  mega_session:
    name: jheliz_digital_mega_session
