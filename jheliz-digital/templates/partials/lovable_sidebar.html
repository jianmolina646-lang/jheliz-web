<aside class="sticky top-0 hidden h-screen w-[248px] shrink-0 flex-col bg-ink text-ink-foreground lg:flex">
  <a class="flex items-center gap-3 px-5 py-6" href="{% url 'dashboard:home' %}"><span class="gradient-primary flex size-10 items-center justify-center rounded-xl font-display text-base font-bold text-primary-foreground">J</span><span class="leading-tight"><strong class="block font-display text-[15px] font-semibold">Jheliz Digital</strong><small class="block text-[11px] text-ink-muted">Panel de control</small></span></a>
  <nav class="flex-1 space-y-1 px-3">
    <a class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-ink-muted" href="{% url 'dashboard:home' %}"><svg class="size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Resumen</span></a>
    <a class="gradient-primary flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-primary-foreground shadow-[var(--shadow-pop)]" href="{% url 'inventory:list' %}"><svg class="size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20 7V6a2 2 0 0 0-2-2H5a3 3 0 0 0 0 6h15v8a2 2 0 0 1-2 2H5a3 3 0 0 1-3-3V7"/><path d="M16 14h2"/></svg><span>Cuentas</span></a>
    <a class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-ink-muted" href="{% url 'sales:list' %}"><svg class="size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m16 3 4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/></svg><span>Ventas</span></a>
    <span class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-ink-muted"><svg class="size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg><span>Pagos</span></span>
    <span class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-ink-muted"><svg class="size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span>Renovaciones</span></span>
    <a class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-ink-muted" href="{% url 'replacements:list' %}"><svg class="size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>Reposiciones</span></a>
    <a class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-ink-muted" href="{% url 'services:list' %}"><svg class="size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/></svg><span>Servicios</span></a>
    <span class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-ink-muted"><svg class="size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16V5"/></svg><span>Reportes</span></span>
  </nav>
  <div class="space-y-2 p-3"><button class="flex w-full items-center gap-3 rounded-xl bg-ink-hover px-3 py-2.5 text-left"><span class="gradient-primary flex size-8 items-center justify-center rounded-lg text-xs font-bold text-primary-foreground">{{ request.user.username|first|upper }}</span><span class="leading-tight"><strong class="block text-[13px] font-semibold">{{ request.user.get_full_name|default:request.user.username }}</strong><small class="block text-[11px] text-ink-muted">{{ request.user.get_role_display }}</small></span><span class="ml-auto text-ink-muted">⌄</span></button><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="flex w-full items-center justify-center gap-2 rounded-xl border border-sidebar-border px-3 py-2.5 text-[13px] text-ink-muted" type="submit">Cerrar sesión</button></form></div>
</aside>
