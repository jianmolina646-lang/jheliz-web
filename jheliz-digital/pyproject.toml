[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jheliz-digital"
version = "0.1.0"
description = "Control profesional de cuentas digitales"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cryptography==50.0.0",
  "Django==5.2.17",
  "gunicorn==23.0.0",
  "psycopg[binary]==3.2.13",
]

[project.optional-dependencies]
dev = ["ruff==0.14.10"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
