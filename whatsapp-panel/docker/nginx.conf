server {
  listen 80;
  server_name marketingjhelizxyz.online www.marketingjhelizxyz.online;
  client_max_body_size 8m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location /api/ { proxy_pass http://api:4000/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { proxy_pass http://panel:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
